<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luyện subnet · CCNA Sổ tay</title>
  <link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <main class="page" id="content">
    <p class="kicker">Công cụ</p>
    <h1>Tính subnet bằng tay, máy chỉ chấm</h1>
    <p class="lede">Phần hướng dẫn hiện từng bước. Phần luyện cho một đề ngẫu nhiên và đợi bạn điền. Đừng dùng phần hướng dẫn để trả lời phần luyện.</p>
    <div class="tool-grid">
      <section class="panel">
        <h2>Giải một địa chỉ</h2>
        <label class="field">Địa chỉ IPv4<input id="ip" value="172.16.20.45" inputmode="decimal"></label>
        <label class="field">Prefix /<input id="prefix" type="number" min="0" max="32" value="20"></label>
        <button class="btn" id="explain" type="button">Hiện cách làm</button>
        <div id="explain-out"></div>
      </section>
      <section class="panel">
        <h2>Luyện</h2>
        <p class="practice-q" id="prompt">Bấm “Đề mới”.</p>
        <label class="field">Địa chỉ mạng<input id="a-net" autocomplete="off"></label>
        <label class="field">Địa chỉ dùng được đầu tiên<input id="a-first" autocomplete="off"></label>
        <label class="field">Địa chỉ dùng được cuối<input id="a-last" autocomplete="off"></label>
        <label class="field">Broadcast<input id="a-bcast" autocomplete="off"></label>
        <label class="field">Số host dùng được<input id="a-hosts" inputmode="numeric" autocomplete="off"></label>
        <div class="hero-actions">
          <button class="btn" id="check" type="button">Chấm</button>
          <button class="btn ghost" id="new" type="button">Đề mới</button>
        </div>
        <p id="verdict"></p>
      </section>
    </div>
  </main>
  <script src="../js/format.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/curriculum.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/subnet.js"></script>
</body>
</html>
